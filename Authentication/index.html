<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen font-sans text-zinc-100">

    <div id="toast" class="fixed top-5 right-5 hidden px-4 py-3 rounded-lg text-white shadow-xl transition-opacity duration-300 z-50 border border-zinc-800 font-medium"></div>

    <div class="bg-zinc-900 p-8 rounded-2xl border border-zinc-800 shadow-2xl w-full max-w-md">
        
        <div id="login-view" class="block">
            <h2 class="text-2xl font-bold mb-6 text-center text-white">Welcome back</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1">Username</label>
                    <input type="text" id="login-username" required class="block w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 text-white transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1">Password</label>
                    <input type="password" id="login-password" required class="block w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 text-white transition-colors">
                </div>
                <button type="submit" id="login-btn" class="w-full flex justify-center py-2.5 px-4 mt-6 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-black bg-white hover:bg-zinc-200 focus:outline-none transition-colors">
                    Log In
                </button>
            </form>
            <p class="mt-6 text-center text-sm text-zinc-400">
                Don't have an account? <a href="#" id="go-to-register" class="font-medium text-indigo-400 hover:text-indigo-300 transition-colors">Sign up</a>
            </p>
        </div>

        <div id="register-view" class="hidden">
            <h2 class="text-2xl font-bold mb-6 text-center text-white">Create an account</h2>
            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1">Username</label>
                    <input type="text" id="reg-username" required class="block w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 text-white transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1">Email</label>
                    <input type="email" id="reg-email" required class="block w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 text-white transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1">Role</label>
                    <input type="text" id="reg-role" placeholder="e.g. ADMIN or USER" required class="block w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 text-white transition-colors">
                    <p class="text-xs text-zinc-500 mt-1">Note: Usually must be exactly 'ADMIN' or 'USER'</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1">Password</label>
                    <input type="password" id="reg-password" required class="block w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 text-white transition-colors">
                </div>
                
                <button type="submit" id="register-btn" class="w-full flex justify-center py-2.5 px-4 mt-6 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-black bg-white hover:bg-zinc-200 focus:outline-none transition-colors">
                    Register
                </button>
            </form>
            <p class="mt-6 text-center text-sm text-zinc-400">
                Already have an account? <a href="#" id="go-to-login" class="font-medium text-indigo-400 hover:text-indigo-300 transition-colors">Log in</a>
            </p>
        </div>

        <div id="dashboard-view" class="hidden text-center">
            <h2 class="text-2xl font-bold mb-4 text-white">Dashboard</h2>
            <div id="user-profile" class="bg-zinc-950 p-6 rounded-xl mb-6 border border-zinc-800 text-left">
                <p class="text-sm text-zinc-500 text-center">Loading user data...</p>
            </div>
            <button id="logout-btn" class="w-full flex justify-center py-2.5 px-4 border border-zinc-800 rounded-lg shadow-sm text-sm font-medium text-zinc-300 bg-zinc-900 hover:bg-zinc-800 hover:text-white transition-colors">
                Log Out
            </button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
